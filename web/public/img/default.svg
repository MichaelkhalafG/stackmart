<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="MDN STACKMART — no preview available" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="82%" cy="14%" r="70%">
      <stop offset="0%" stop-color="#010ed0" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#010ed0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Navy tile + royal glow + faint coding grid (the brand's dark-section language). -->
  <rect width="1200" height="675" fill="#021d2e"/>
  <rect width="1200" height="675" fill="#032b42" opacity="0.85"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Centred stacked-layers mark: lavender / royal / white (matches the icons + OG card). -->
  <g transform="translate(511 246)">
    <rect width="178" height="26" rx="13" fill="#dee0ff"/>
    <rect y="38" width="178" height="26" rx="13" fill="#010ed0"/>
    <rect y="76" width="178" height="26" rx="13" fill="#ffffff"/>
  </g>

  <text x="600" y="416" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="1.5">MDN STACKMART</text>
  <text x="600" y="456" text-anchor="middle" fill="#9aa4b2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="0.5">no preview available</text>
</svg>
